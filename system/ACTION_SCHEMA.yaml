openapi: 3.1.0

info:
  title: AI Semiconductor Research OS GitHub API
  description: >-
    Reads the GitHub source of truth for study resume, progress, next topic, and
    paper continuation. Use for "이전 공부를 이어나가자", "어디까지 공부했어?",
    and "논문을 마저 읽자". Reads need no confirmation; Learning Log, Paper Note,
    and Progress Update writes require the matching user approval.
  version: 0.3.0

servers:
  - url: https://api.github.com

security:
  - bearerAuth: []

paths:
  /repos/thisisjskim/ai-semiconductor-study/contents:
    get:
      operationId: listRepositoryRoot
      summary: List repository root
      description: >-
        Lists root files and directories only when an exact study path is unknown.
        Prefer getStudyPath for the mandatory learning-session bootstrap.
      parameters:
        - name: ref
          in: query
          required: false
          schema:
            type: string
            default: main
      responses:
        "200":
          description: Repository root contents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentItem"

  /repos/thisisjskim/ai-semiconductor-study/contents/{path}:
    get:
      operationId: getStudyPath
      summary: Read the current study state or list a study directory
      description: >-
        For "이전 공부를 이어나가자" and every learning request, first call once
        with path=state/CURRENT_LEARNING_CONTEXT.md and ref=main, then begin from
        its Current Topic and Next Action. Read other files only when exact
        evidence is needed.
      parameters:
        - name: path
          in: path
          required: true
          description: Repository-relative file or directory path.
          schema:
            type: string
        - name: ref
          in: query
          required: false
          schema:
            type: string
            default: main
      responses:
        "200":
          description: File content or directory listing
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileContent"
                  - type: array
                    items:
                      $ref: "#/components/schemas/ContentItem"
        "404":
          description: File or directory does not exist

  /repos/thisisjskim/ai-semiconductor-study/issues:
    post:
      operationId: createLearningLogIssue
      summary: Start an approved Research OS request
      description: Creates one plain-text Issue after the matching user approval. Each request type uses its own title and body contract.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LearningLogIssueRequest"
                - $ref: "#/components/schemas/PaperNoteIssueRequest"
                - $ref: "#/components/schemas/ProgressUpdateIssueRequest"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /repos/thisisjskim/ai-semiconductor-study/issues/{issue_number}/comments:
    get:
      operationId: listLearningLogIssueComments
      summary: Check Research OS processing results
      description: Lists Issue comments to verify the Learning Log or Progress Update success or failure result.
      parameters:
        - name: issue_number
          in: path
          required: true
          description: Issue number returned by createLearningLogIssue.
          schema:
            type: integer
      responses:
        "200":
          description: Issue comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssueComment"
    post:
      operationId: appendLearningLogChunk
      summary: Append the next research record chunk
      description: Appends plain Markdown to an existing approved Learning Log or Paper Note Issue. Progress Update requests must not use chunks.
      x-openai-isConsequential: true
      parameters:
        - name: issue_number
          in: path
          required: true
          description: Issue number returned by createLearningLogIssue.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  description: Next plain Markdown chunk only. Do not repeat the ingest envelope.
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueComment"

  /repos/thisisjskim/ai-semiconductor-study/issues/{issue_number}:
    get:
      operationId: getLearningLogIssue
      summary: Read a Research OS request Issue
      description: Reads the Issue state and URL before or after processing.
      parameters:
        - name: issue_number
          in: path
          required: true
          description: Issue number returned by createLearningLogIssue.
          schema:
            type: integer
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
    patch:
      operationId: closeLearningLogIssue
      summary: Finish an approved Research OS request
      description: Closes the Issue after its body and any Learning Log chunks are complete. Closing triggers the title-specific GitHub Actions workflow.
      x-openai-isConsequential: true
      parameters:
        - name: issue_number
          in: path
          required: true
          description: Issue number returned by createLearningLogIssue.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [closed]
                  default: closed
      responses:
        "200":
          description: Issue closed and processing queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    LearningLogIssueRequest:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: '^\[learning-log\] \d{4}-\d{2}-\d{2} [a-z0-9]+(?:-[a-z0-9]+)*$'
        body:
          type: string
          description: research-os-ingest:v1 envelope followed by the first plain Markdown chunk. Keep each chunk below 30000 characters.

    ProgressUpdateIssueRequest:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: '^\[progress-update\] \d{4}-\d{2}-\d{2}$'
          description: Must be [progress-update] YYYY-MM-DD.
        body:
          type: string
          description: >-
            research-os-progress-update:v1 envelope with roadmap/PROGRESS.md and the
            latest expected_sha, then JSON evidence_paths and changes. Allow current_focus
            for Current Stage, Current Topic, or Last Updated; allow dashboard_status only
            for Not Started to Learning. Do not append chunks.
          example: |-
            <!-- research-os-progress-update:v1
            target_path: roadmap/PROGRESS.md
            expected_sha: 0123456789abcdef0123456789abcdef01234567
            -->
            {
              "evidence_paths": ["learning-logs/2026/08/2026-08-13-npu-buffer.md"],
              "changes": [
                {"type": "current_focus", "field": "Current Stage", "from": "Stage 3 — Memory", "to": "Stage 4 — NPU Architecture"},
                {"type": "dashboard_status", "stage": "NPU Architecture", "from": "Not Started", "to": "Learning"}
              ]
            }

    PaperNoteIssueRequest:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: '^\[paper-note\] \d{4}-\d{2}-\d{2} [a-z0-9]+(?:-[a-z0-9]+)*$'
        body:
          type: string
          description: research-os-ingest:v1 envelope followed by the first canonical Paper Note Markdown chunk. Keep each chunk below 30000 characters.

    ContentItem:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        sha: { type: string }
        type: { type: string }
        size: { type: integer }
        html_url: { type: string }
        download_url:
          type: [string, "null"]

    FileContent:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        sha: { type: string }
        size: { type: integer }
        type: { type: string }
        content:
          type: string
          description: Base64 returned by GitHub for reads only. Never reuse it for writes.
        encoding: { type: string }
        html_url: { type: string }

    Issue:
      type: object
      properties:
        number: { type: integer }
        title: { type: string }
        state: { type: string }
        body: { type: [string, "null"] }
        html_url: { type: string }

    IssueComment:
      type: object
      properties:
        id: { type: integer }
        body: { type: [string, "null"] }
        html_url: { type: string }
        user:
          type: object
          properties:
            login: { type: string }
