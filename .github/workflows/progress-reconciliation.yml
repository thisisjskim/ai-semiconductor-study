name: Progress Reconciliation Proposal

on:
  workflow_run:
    workflows: ["Learning Context Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-log-main
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run reconciliation tests
        run: python -B scripts/test_build_progress_reconciliation.py

      - name: Build reconciliation proposal
        run: python -B scripts/build_progress_reconciliation.py

      - name: Validate generated change
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(
            git status --porcelain --untracked-files=all | sed 's/^...//'
          )
          if (( ${#changed_paths[@]} > 1 )); then
            printf 'Unexpected files changed:\n%s\n' "${changed_paths[@]}" >&2
            exit 1
          fi
          if (( ${#changed_paths[@]} == 1 )) && [[ "${changed_paths[0]}" != "state/PROGRESS_RECONCILIATION.md" ]]; then
            echo "Unexpected file changed: ${changed_paths[0]}" >&2
            exit 1
          fi
          if (( ${#changed_paths[@]} == 0 )); then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit reconciliation proposal
        if: steps.validate.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/PROGRESS_RECONCILIATION.md
          git commit -m "state: refresh progress reconciliation proposal"
          git push origin HEAD:main
