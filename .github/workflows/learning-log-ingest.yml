name: Learning Log Ingest

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "다시 처리할 Learning Log Issue 번호"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  # Serialize writes to main so separate Issues cannot race each other.
  group: learning-log-main
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build ingest payload
        id: payload
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          PAYLOAD_PATH: ${{ runner.temp }}/ingest-payload.json
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed("Issue 번호를 확인할 수 없습니다.");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber,
            });
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 },
            );
            const payload = {
              number: issue.number,
              title: issue.title,
              author: issue.user?.login || "",
              repository_owner: owner,
              body: issue.body || "",
              comments: comments.map((comment) => ({
                author: comment.user?.login || "",
                body: comment.body || "",
              })),
            };

            require("fs").writeFileSync(
              process.env.PAYLOAD_PATH, JSON.stringify(payload), "utf8",
            );
            core.setOutput("issue_number", String(issueNumber));

      - name: Run contract tests
        run: python -B scripts/test_ingest_learning_log.py

      - name: Ingest Learning Log
        id: ingest
        run: |
          python scripts/ingest_learning_log.py \
            --payload "$RUNNER_TEMP/ingest-payload.json" \
            --root . \
            --report "$RUNNER_TEMP/ingest-report.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate ingest result
        id: validate
        env:
          TARGET_PATH: ${{ steps.ingest.outputs.target_path }}
        run: |
          set -euo pipefail

          if [[ -z "$TARGET_PATH" || "$TARGET_PATH" != learning-logs/* ]]; then
            echo "Invalid target path: $TARGET_PATH" >&2
            exit 1
          fi
          if [[ ! -f "$TARGET_PATH" ]]; then
            echo "Target file was not created: $TARGET_PATH" >&2
            exit 1
          fi

          mapfile -t changed_paths < <(
            git status --porcelain --untracked-files=all | sed 's/^...//'
          )
          if (( ${#changed_paths[@]} > 1 )); then
            printf 'Unexpected files changed:\n%s\n' "${changed_paths[@]}" >&2
            exit 1
          fi
          if (( ${#changed_paths[@]} == 1 )) && [[ "${changed_paths[0]}" != "$TARGET_PATH" ]]; then
            echo "Unexpected file changed: ${changed_paths[0]}" >&2
            exit 1
          fi

          if (( ${#changed_paths[@]} == 0 )); then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Learning Log
        id: commit
        env:
          TARGET_PATH: ${{ steps.ingest.outputs.target_path }}
          OPERATION: ${{ steps.ingest.outputs.operation }}
          HAS_CHANGES: ${{ steps.validate.outputs.has_changes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$HAS_CHANGES" == "true" ]]; then
            git add -- "$TARGET_PATH"
            if [[ "$OPERATION" == "create" ]]; then
              COMMIT_MESSAGE="학습 기록: 새 기록 생성 - ${TARGET_PATH}"
            else
              COMMIT_MESSAGE="학습 기록: 기존 기록 수정 - ${TARGET_PATH}"
            fi
            git commit -m "$COMMIT_MESSAGE"
            git push origin HEAD:main
          else
            echo "Learning Log is already up to date; no commit needed."
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.payload.outputs.issue_number }}
          TARGET_PATH: ${{ steps.ingest.outputs.target_path }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const path = process.env.TARGET_PATH;
            const commit = process.env.COMMIT_SHA;
            const fileUrl = `${context.serverUrl}/${owner}/${repo}/blob/${commit}/${path}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${commit}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body:
                "<!-- research-os-result -->\n" +
                "✅ Learning Log 처리 완료\n\n" +
                `- Path: [\`${path}\`](${fileUrl})\n` +
                `- Commit: [\`${commit.slice(0, 7)}\`](${commitUrl})`,
            });

      - name: Comment failure
        if: failure() && steps.payload.outputs.issue_number
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.payload.outputs.issue_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body:
                "<!-- research-os-result -->\n" +
                "❌ Learning Log 처리 실패\n\n" +
                `- Actions 실행 로그: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
