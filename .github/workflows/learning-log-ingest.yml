name: Learning Log Ingest

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "다시 처리할 Learning Log Issue 번호"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: learning-log-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build ingest payload
        id: payload
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed("Issue 번호를 확인할 수 없습니다.");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber,
            });
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 },
            );
            const payload = {
              number: issue.number,
              title: issue.title,
              author: issue.user?.login || "",
              repository_owner: owner,
              body: issue.body || "",
              comments: comments.map((comment) => ({
                author: comment.user?.login || "",
                body: comment.body || "",
              })),
            };

            require("fs").writeFileSync(
              "ingest-payload.json", JSON.stringify(payload), "utf8",
            );
            core.setOutput("issue_number", String(issueNumber));

      - name: Ingest Learning Log
        id: ingest
        run: |
          python scripts/ingest_learning_log.py \
            --payload ingest-payload.json \
            --root . \
            --report ingest-report.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Commit Learning Log
        id: commit
        env:
          TARGET_PATH: ${{ steps.ingest.outputs.target_path }}
          OPERATION: ${{ steps.ingest.outputs.operation }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          git commit -m "log: ${OPERATION} ${TARGET_PATH}"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.payload.outputs.issue_number }}
          TARGET_PATH: ${{ steps.ingest.outputs.target_path }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const path = process.env.TARGET_PATH;
            const commit = process.env.COMMIT_SHA;
            const fileUrl = `${context.serverUrl}/${owner}/${repo}/blob/${commit}/${path}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${commit}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body:
                "<!-- research-os-result -->\n" +
                "✅ Learning Log 처리 완료\n\n" +
                `- Path: [\`${path}\`](${fileUrl})\n` +
                `- Commit: [\`${commit.slice(0, 7)}\`](${commitUrl})`,
            });

      - name: Comment failure
        if: failure() && steps.payload.outputs.issue_number
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.payload.outputs.issue_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body:
                "<!-- research-os-result -->\n" +
                "❌ Learning Log 처리 실패\n\n" +
                `- Actions 실행 로그: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
