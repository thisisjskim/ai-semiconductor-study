name: Learning Context Refresh

on:
  push:
    branches: [main]
    paths:
      - "learning-logs/**"
  # GITHUB_TOKEN pushes do not emit new push workflow runs. This preserves the
  # separate workflow boundary while refreshing after a successful ingest.
  workflow_run:
    workflows: ["Learning Log Ingest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with Learning Log Ingest so writes to main are serialized.
  group: learning-log-main
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run context builder tests
        run: python -B scripts/test_build_learning_context.py

      - name: Build current learning context
        run: python -B scripts/build_learning_context.py

      - name: Validate generated change
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(
            git status --porcelain --untracked-files=all | sed 's/^...//'
          )
          if (( ${#changed_paths[@]} > 1 )); then
            printf 'Unexpected files changed:\n%s\n' "${changed_paths[@]}" >&2
            exit 1
          fi
          if (( ${#changed_paths[@]} == 1 )) && [[ "${changed_paths[0]}" != "state/CURRENT_LEARNING_CONTEXT.md" ]]; then
            echo "Unexpected file changed: ${changed_paths[0]}" >&2
            exit 1
          fi
          if (( ${#changed_paths[@]} == 0 )); then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed context
        if: steps.validate.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/CURRENT_LEARNING_CONTEXT.md
          git commit -m "state: refresh current learning context"
          git push origin HEAD:main
